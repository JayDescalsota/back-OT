supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

sandbox:
  enabled: true

homepage:
  enabled: false

cors:
  origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8080
    - https://studio.apollographql.com

include_subgraph_errors:
  all: true

headers:
  all:
    request:
      - propagate:
          named: "x-user-id"
      - propagate:
          named: "x-tenant-id"
      - propagate:
          named: "x-branch-id"
      - propagate:
          named: "authorization"
