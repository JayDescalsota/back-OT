supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

sandbox:
  enabled: true

homepage:
  enabled: false

cors:
  allow_any_origin: true

include_subgraph_errors:
  all: true

headers:
  all:
    request:
      - propagate:
          named: "x-user-id"
      - propagate:
          named: "x-tenant-id"
      - propagate:
          named: "x-branch-id"
      - propagate:
          named: "authorization"
      - propagate:
          named: "x-app-id"
