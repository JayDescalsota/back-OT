schema:
  - graph/schema.graphqls

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  filename: graph/generated/federation.go
  package: generated
  version: 2

models:
  Address:
    model: github.com/clinicmanager/services/user/graph/model.Address
