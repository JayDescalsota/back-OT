schema:
  - graph/schema.graphqls
exec:
  filename: graph/generated/generated.go

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  filename: graph/generated/federation.go
  package: generated
  version: 2

models:
  Patient:
    model: github.com/clinicmanager/services/patient/db.BunPatients
  Guardian:
    model: github.com/clinicmanager/services/patient/db.BunGuardians
  Address:
    model: github.com/clinicmanager/services/patient/graph/model.Address
  PatientAddress:
    model: github.com/clinicmanager/services/patient/db.BunPatientAddress
  PatientTags:
    model: github.com/clinicmanager/services/patient/db.BunPatientTags
  PatientGuardians:
    model: github.com/clinicmanager/services/patient/db.BunPatientGuardians
  Goal:
    model: github.com/clinicmanager/services/patient/db.BunGoal
