schema:
  - graph/schema.graphqls
exec:
  filename: graph/generated/generated.go

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  filename: graph/generated/federation.go
  package: generated
  version: 2

models:
  MessageThread:
    model: github.com/clinicmanager/services/messaging/db.BunMessageThread
  Message:
    model: github.com/clinicmanager/services/messaging/db.BunMessage
  MessageParticipant:
    model: github.com/clinicmanager/services/messaging/db.BunMessageParticipant
