name: clinic

services:
  loki:
    image: grafana/loki:2.9.8
    container_name: clinic_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:2.9.8
    container_name: clinic_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    container_name: clinic_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  db:
    image: postgres:17
    container_name: clinic_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: clinic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: clinic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  router:
    image: ghcr.io/apollographql/router:v1.45.0
    container_name: clinic_apollo_router
    environment:
      NO_PROXY: router,user,tenant,patient,booking,messaging,gateway,localhost,127.0.0.1
      no_proxy: router,user,tenant,patient,booking,messaging,gateway,localhost,127.0.0.1
    ports:
      - "4001"  # internal — accessible via Docker DNS
    volumes:
      - ./rover/supergraph.graphql:/dist/config/supergraph.graphql
      - ./rover/router.yaml:/dist/config/router.yaml
    command: -s /dist/config/supergraph.graphql -c /dist/config/router.yaml
    depends_on:
      - user
      - tenant
      - patient
      - booking
      - messaging

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: clinic/gateway:latest
    container_name: clinic_gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      IN_DOCKER: "true"
      ROUTER_URL: http://router:4000
      USER_SVC_URL: http://user:8181
      NO_PROXY: router,user,tenant,patient,booking,messaging,gateway,localhost,127.0.0.1
      no_proxy: router,user,tenant,patient,booking,messaging,gateway,localhost,127.0.0.1
    volumes:
      - ./.env:/app/.env
    depends_on:
      - router
      - redis

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    image: clinic/user:latest
    container_name: clinic_user
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IN_DOCKER: "true"
    ports:
      - "8181:8181"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  tenant:
    build:
      context: .
      dockerfile: services/tenant/Dockerfile
    image: clinic/tenant:latest
    container_name: clinic_tenant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IN_DOCKER: "true"
    ports:
      - "8182:8182"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  patient:
    build:
      context: .
      dockerfile: services/patient/Dockerfile
    image: clinic/patient:latest
    container_name: clinic_patient
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IN_DOCKER: "true"
    ports:
      - "8183:8183"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  booking:
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    image: clinic/booking:latest
    container_name: clinic_booking
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IN_DOCKER: "true"
    ports:
      - "8184:8184"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  messaging:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    image: clinic/messaging:latest
    container_name: clinic_messaging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IN_DOCKER: "true"
    ports:
      - "8185:8185"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  grafana-data:
