services:
  db:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: clinic_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    image: clinic/user:latest
    container_name: user
    restart: unless-stopped
    env_file:
      - .env
    environment:
      USERDB_URL: postgres://postgres:1@db:5432/auth?sslmode=disable
    ports:
      - "8081:8081"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  router:
    image: ghcr.io/apollographql/router:v1.45.0
    container_name: apollo_router
    ports:
      - "4000:4000"
    volumes:
      - ./supergraph.graphql:/dist/config/supergraph.graphql
      - ./router.yaml:/dist/config/router.yaml
    command: -s /dist/config/supergraph.graphql -c /dist/config/router.yaml
    depends_on:
      - user

volumes:
  postgres_data:
